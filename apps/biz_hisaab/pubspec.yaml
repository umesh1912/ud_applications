name: biz_hisaab
description: Hisaab — GST billing, invoices, payments, stock and khata for your shop.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ud_core:
    path: ../../packages/ud_core
  pdf: ">=3.11.0 <4.0.0"
  printing: ">=5.13.0 <6.0.0"
  image_picker: ^1.1.2

dev_dependencies:
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png

flutter_native_splash:
  color: "#F6F1E7"
  color_dark: "#14130F"
  image: assets/icon/splash.png
  android_12:
    color: "#F6F1E7"
    color_dark: "#14130F"
    image: assets/icon/foreground.png
    icon_background_color: "#B4235A"
    icon_background_color_dark: "#B4235A"
  ios: false
  web: false
