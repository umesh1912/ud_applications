name: vehicle_gaadi
description: Gaadi — vehicle papers, renewals, fuel log and official RTO services.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ud_core:
    path: ../../packages/ud_core

dev_dependencies:
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png

flutter_native_splash:
  color: "#F6F1E7"
  color_dark: "#14130F"
  image: assets/icon/splash.png
  android_12:
    color: "#F6F1E7"
    color_dark: "#14130F"
    image: assets/icon/foreground.png
    icon_background_color: "#3F4752"
    icon_background_color_dark: "#3F4752"
  ios: false
  web: false
