name: vehicle_gaadi
description: Gaadi — vehicle papers, renewals, fuel log and official RTO services.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ud_core:
    path: ../../packages/ud_core

dev_dependencies:
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#3F4752"
  adaptive_icon_foreground: assets/icon/foreground.png
