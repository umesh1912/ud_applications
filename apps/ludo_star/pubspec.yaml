name: ludo_star
description: Ludo Royale — classic, quick and rush Ludo.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ud_core:
    path: ../../packages/ud_core

dev_dependencies:
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#6B3FA0"
  adaptive_icon_foreground: assets/icon/foreground.png
