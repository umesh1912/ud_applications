name: dial_abroad
description: Dial Abroad — call family abroad at the right time, by phone or WhatsApp.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ud_core:
    path: ../../packages/ud_core
  timezone: ">=0.9.4 <1.0.0"

dev_dependencies:
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#127A7A"
  adaptive_icon_foreground: assets/icon/foreground.png
