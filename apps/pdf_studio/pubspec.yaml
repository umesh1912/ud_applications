name: pdf_studio
description: PDF Studio — view, merge, split, sign and protect PDFs offline.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ud_core:
    path: ../../packages/ud_core
  syncfusion_flutter_pdf: ">=27.1.48 <40.0.0"
  syncfusion_flutter_pdfviewer: ">=27.1.48 <40.0.0"
  image_picker: ^1.1.2
  open_filex: ^4.6.0

dev_dependencies:
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png

flutter_native_splash:
  color: "#F6F1E7"
  color_dark: "#14130F"
  image: assets/icon/splash.png
  android_12:
    color: "#F6F1E7"
    color_dark: "#14130F"
    image: assets/icon/foreground.png
    icon_background_color: "#A3273B"
    icon_background_color_dark: "#A3273B"
  ios: false
  web: false
