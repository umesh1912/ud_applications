name: video_recorder
description: ClipCam — record videos with pause, flip and torch; keep or share them.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ud_core:
    path: ../../packages/ud_core
  camera: ^0.11.0
  video_player: ^2.9.0
  gal: ^2.3.0
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png

flutter_native_splash:
  color: "#F6F1E7"
  color_dark: "#14130F"
  image: assets/icon/splash.png
  android_12:
    color: "#F6F1E7"
    color_dark: "#14130F"
    image: assets/icon/foreground.png
    icon_background_color: "#C2412F"
    icon_background_color_dark: "#C2412F"
  ios: false
  web: false
