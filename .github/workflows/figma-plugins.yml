name: Figma plugins

on:
  push:
    paths: ['figma_plugins/**', '.github/workflows/figma-plugins.yml']
  pull_request:
    paths: ['figma_plugins/**', '.github/workflows/figma-plugins.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: figma_plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Committed code.js files are up to date
        run: git diff --exit-code -- '*/code.js'
