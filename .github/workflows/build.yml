name: Build Android apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: doc_scanner
            label: DocScan
          - app: doc_vault
            label: Vault
          - app: sign_maker
            label: Signa
          - app: pdf_studio
            label: PDF Studio
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter --version
          flutter create --platforms=android --org com.udapps --project-name "$APP" .
          rm -rf test

      - name: Add upload key (only if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "apps/$APP/android/app/upload-keystore.jks"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-upload}"
              echo "storeFile=upload-keystore.jks"
            } > "apps/$APP/android/key.properties"
            echo "Upload key added."
          else
            echo "No KEYSTORE_BASE64 secret: building test-signed files."
          fi

      - name: Configure Android project
        run: python3 tool/prepare_android.py "apps/$APP" "${{ matrix.label }}"

      - name: Get packages and icons
        working-directory: apps/${{ matrix.app }}
        run: |
          ../../tool/ci_run.sh "pub get $APP" flutter pub get
          ../../tool/ci_run.sh "icons $APP" dart run flutter_launcher_icons

      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E "^\s*error " analyze.txt | head -n 40 | while IFS= read -r line; do echo "::error title=analyze $APP::$line"; done
          if grep -qE "^\s*error " analyze.txt; then exit 1; fi

      - name: Build APK and Play bundle
        working-directory: apps/${{ matrix.app }}
        run: |
          ../../tool/ci_run.sh "apk $APP" flutter build apk --release --build-number=${{ github.run_number }}
          ../../tool/ci_run.sh "aab $APP" flutter build appbundle --release --build-number=${{ github.run_number }}
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/$APP.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/$APP.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: out/*

  release:
    name: Publish downloads
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: List files
        run: ls -la out || true

      - uses: softprops/action-gh-release@v2
        if: hashFiles('out/*') != ''
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Download the `.apk` file to install directly on your phone.
            Upload the `.aab` file to Google Play Console.
          files: out/*
