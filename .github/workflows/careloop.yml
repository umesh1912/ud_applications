name: CareLoop APKs

# web_apps/careloop is one React + Capacitor codebase built as two Android apps:
# CareLoop (patients, VITE_ROLE=patient) and CareLoop Pro (doctors, VITE_ROLE=doctor).
on:
  push:
    branches: [main, careloop]
    paths: ["web_apps/careloop/**", ".github/workflows/careloop.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: web_apps/careloop

jobs:
  apk:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: careloop, role: patient, name: CareLoop }
          - { slug: careloop_pro, role: doctor, name: CareLoop Pro }
    env:
      APP: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_apps/careloop/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME).

      - run: npm ci
      - run: pip install pillow

      - name: Test security rules
        run: npx firebase emulators:exec --only firestore --project demo-careloop "npm run test:rules"

      # The APK must point at your real Firebase project (src/firebase-config.ts), not the local emulator.
      - name: Check Firebase config
        id: cfg
        run: |
          if grep -q "projectId: 'demo-" src/firebase-config.ts; then
            echo "::warning title=Firebase not configured::Paste your Firebase web config into web_apps/careloop/src/firebase-config.ts to build installable APKs."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web app
        run: |
          npm run typecheck
          VITE_ROLE=${{ matrix.role }} npx vite build

      - name: Generate Android project
        if: steps.cfg.outputs.ready == 'true'
        run: |
          npx cap add android
          chmod +x android/gradlew

      - name: Signing key (your upload key if set, else the shared test key)
        if: steps.cfg.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-upload}"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Upload key added."
          else
            # Same test key on every build, so a new APK installs over the old one.
            cp ../../tool/test-signing.jks android/upload-keystore.jks
            {
              echo "storePassword=udapps-test-signing"
              echo "keyPassword=udapps-test-signing"
              echo "keyAlias=udapps-test"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "No KEYSTORE_BASE64 secret: signing with the shared test key (tool/test-signing.jks)."
          fi

      - name: Icons, theme and version
        if: steps.cfg.outputs.ready == 'true'
        run: python3 tool/prepare_android.py "$APP" ${{ github.run_number }}

      - name: Build APK
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          (cd android && ../../../tool/ci_run.sh "apk $APP" ./gradlew assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/$APP.apk"
          # Play Store bundle only with your own upload key.
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            (cd android && ./gradlew bundleRelease)
            cp android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/$APP.aab"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: careloop-${{ matrix.slug }}
          path: out/*

  # Deploys firebase/firestore.rules and indexes when a service-account key is set as the
  # FIREBASE_SERVICE_ACCOUNT secret (Firebase console → Project settings → Service accounts → Generate key).
  deploy-rules:
    name: Deploy Firestore rules
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/careloop'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_apps/careloop/package-lock.json
      - run: npm ci
      - name: Deploy rules and indexes
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret: paste firebase/firestore.rules into the Firebase console instead."; exit 0; fi
          PROJECT=$(sed -n "s/.*projectId: '\([^']*\)'.*/\1/p" src/firebase-config.ts | head -1)
          case "$PROJECT" in demo-*) echo "Firebase config not set yet."; exit 0;; esac
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only firestore --project "$PROJECT" --non-interactive

  release:
    name: Publish downloads
    needs: apk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: careloop-*
          merge-multiple: true

      - name: Write download page
        working-directory: .
        run: |
          ls -la out || true
          python3 web_apps/careloop/tool/release_notes.py "careloop-${{ github.run_number }}" "${{ github.ref_name }}" out > notes.md

      - uses: softprops/action-gh-release@v2
        if: hashFiles('out/*') != ''
        with:
          tag_name: careloop-${{ github.run_number }}
          name: CareLoop ${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body_path: notes.md
          files: out/*
